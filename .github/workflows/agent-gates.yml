# Inline copy (public repos cannot call private company-hq reusable workflows). GENERATED by company-hq/scripts/governance/sync_gate_inline.py, keep in sync with company-hq.
# Policy 27 Oct 2026: Task/branch name = warnings only; payment PRs are auto-approved (label R-approved) when CI green + no secrets + Stripe smoke OK.
name: agent-gates
on:
  pull_request:
    types: ["opened", "edited", "synchronize", "reopened", "labeled", "unlabeled"]
jobs:
  gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Collect PR info
        id: info
        env:
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE" "$HEAD" > files.txt
          echo "Changed files:"; cat files.txt
          if grep -qvE '\.(md|txt)$|^docs/|^project/|^\.github/ISSUE_TEMPLATE/|^LICENSE' files.txt; then echo "docs_only=false" >> $GITHUB_OUTPUT; else echo "docs_only=true" >> $GITHUB_OUTPUT; fi
      - name: Task + Agent trailers (warn-only)
        if: steps.info.outputs.docs_only == 'false'
        env: {BODY: "${{ github.event.pull_request.body }}", LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') }}", ACTOR: "${{ github.event.pull_request.user.login }}", BRANCH: "${{ github.head_ref }}"}
        run: |
          # Warn-only (policy 27 Oct 2026): missing Task/Agent lines or a branch not named task/<n>-slug NEVER block a merge. Bots (dependabot) skipped.
          if echo "$LABELS" | grep -q 'human'; then echo "human PR (label), skip"; exit 0; fi
          case "$ACTOR" in *'[bot]') echo "bot PR ($ACTOR), skip"; exit 0;; esac
          echo "$BODY" | grep -qiE '^\s*Task:\s*\S+' || echo "::warning::PR body should have 'Task: JAGAT-IT-UK-LTD/company-hq#<n>'"
          echo "$BODY" | grep -qiE '^\s*Agent:\s*\S+' || echo "::warning::PR body should have 'Agent: <name>/<model>'"
          echo "$BRANCH" | grep -qE '^task/[0-9]+-[a-z0-9._-]+$' || echo "::warning::branch '$BRANCH' is not task/<n>-slug (nice to have, not required)"
          exit 0
      - name: Payment guard + auto-gate
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          hit=""
          grep -iE '(^|/)(payments?|billing|checkout|stripe|webhooks?|pricing|prices?)(/|\.|$)|core-payments' files.txt && hit="paths"
          git diff "$BASE" "$HEAD" -- . ':(exclude)*.md' ':(exclude)package-lock.json' ':(exclude).github/**' | grep -E '^\+' | grep -vE '^\+\+\+ ' | grep -iqE 'stripe|sk_live|rk_live|paystation|bkash|sslcommerz|checkout|webhook|price_|unit_amount|payout|refund' && hit="$hit keywords"
          if [ -z "$hit" ]; then echo "No payment-related change: no R-approved needed."; exit 0; fi
          echo "Payment-related change detected ($hit)."
          if echo "$LABELS" | grep -q 'R-approved'; then echo "R-approved label present: OK"; exit 0; fi
          # Auto-gate (policy 27 Oct 2026, nothing waits for Ruhul): CI green + no secrets + Stripe test smoke (if any) -> adds R-approved itself.
          # Source of truth: company-hq/scripts/governance/autogate_pr.py (embedded below by sync_gate_inline.py).
          GLD="${RUNNER_TEMP:-/tmp}/gl"; mkdir -p "$GLD"
          if curl -fsSL --max-time 60 -o "$GLD/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz && echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $GLD/gl.tgz" | sha256sum -c - >/dev/null 2>&1 && tar xzf "$GLD/gl.tgz" -C "$GLD" gitleaks; then export GITLEAKS="$GLD/gitleaks"; else echo "note: gitleaks download failed, regex scan only"; fi
          python3 - <<'PYGATE'
          #!/usr/bin/env python3
          """Single-PR auto payment gate. EMBEDDED in .github/workflows/agent-gates.yml (and the inline copies in public repos);
          keep this file and the workflow in sync (scripts/governance/sync_gate_inline.py does it). Standard library only.
          Runs inside the `gates` job on the vps-light runner (no secrets, restricted container) with the repo's GITHUB_TOKEN.
          Env: GH_TOKEN, REPO (owner/name), PR, GITLEAKS (optional path to gitleaks binary), WAIT (seconds to wait for running CI, default 420).
          Exit 0 + label R-approved + comment 'auto-R-approved by gate' when ALL pass:
            1 CI checks/statuses on the head commit (except the gate itself) are green, none failed/running (none present = noted, vacuous)
            2 no secret in the lines the PR adds (gitleaks + live-key regex)
            3 if the repo has a Stripe test-mode smoke path: a green check/status named like stripe|smoke exists
          Otherwise exit 1 and ONE comment with the reasons. Never merges, never touches keys/prices/config, never runs PR code."""
          import json, os, re, shutil, subprocess, sys, tempfile, time, hashlib, base64, urllib.request, urllib.error
          TOK = os.environ['GH_TOKEN']; REPO = os.environ['REPO']; N = os.environ['PR']; LABEL = 'R-approved'
          API = 'https://api.github.com'
          def req(method, path, data=None):
              if os.environ.get('DRY') and method != 'GET':
                  print('[dry]', method, path, json.dumps(data)[:600]); return {}, ''
              r = urllib.request.Request(API + path if path.startswith('/') else path, method=method,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization': f'Bearer {TOK}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'jagat-autogate'})
              try:
                  with urllib.request.urlopen(r, timeout=60) as f:
                      body = f.read().decode() or 'null'
                      return json.loads(body), f.headers.get('Link', '')
              except urllib.error.HTTPError as e:
                  return {'_err': e.code, '_msg': e.read().decode()[:200]}, ''
          def get(path):
              d, _ = req('GET', path); return None if isinstance(d, dict) and '_err' in d else d
          def paged(path, key=None):
              out = []; url = path + ('&' if '?' in path else '?') + 'per_page=100'; page = 1
              while page < 30:
                  d, link = req('GET', f'{url}&page={page}')
                  if isinstance(d, dict) and '_err' in d: return out
                  items = d.get(key, []) if key and isinstance(d, dict) else d
                  out += items
                  if len(items) < 100: break
                  page += 1
              return out
          PAY_PATH = re.compile(r'(^|/)(payments?|billing|checkout|stripe|webhooks?|pricing|prices?)(/|\.|$)|core-payments', re.I)
          PAY_KW = re.compile(r'stripe|sk_live|rk_live|paystation|bkash|sslcommerz|checkout|webhook|price_|unit_amount|payout|refund', re.I)
          KW_SKIP = re.compile(r'\.md$|(^|/)package-lock\.json$|^\.github/', re.I)
          LIVE_KEY = re.compile(r'\b(sk|rk)_live_[A-Za-z0-9]{10,}|\bwhsec_[A-Za-z0-9]{16,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|\bAKIA[0-9A-Z]{16}\b|\bghp_[A-Za-z0-9]{30,}|\bxox[bp]-[A-Za-z0-9-]{20,}')
          SMOKE_PATH = re.compile(r'(^|/)[^/]*(stripe[-_.]?smoke|smoke[-_.]?stripe)[^/]*$', re.I)
          SMOKE_SCRIPT = re.compile(r'smoke.*stripe|stripe.*smoke|test:stripe|stripe:test|smoke:pay', re.I)
          SMOKE_CHECK = re.compile(r'stripe|smoke', re.I)
          OK_C = {'success', 'neutral', 'skipped'}
          def now(): return time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          def comment(body):
              req('POST', f'/repos/{REPO}/issues/{N}/comments', {'body': body})
          def finish_block(sig, why, reasons):
              mark = f'<!-- autogate:block {sig} -->'
              if not any(mark in (c.get('body') or '') for c in paged(f'/repos/{REPO}/issues/{N}/comments')):
                  comment(f'{mark}\n**Payment gate: not auto-approved (commit {sig.split(":")[0]}).** Payment-related change ({"; ".join(why)}).\n\n' + '\n'.join(f'- {r}' for r in reasons)
                          + '\n\nPush a fix (or re-run the failed job) and the gate approves by itself. Nobody has to wait for Ruhul; he can also say "approve" in chat and Claude/Grok add the label.')
              for r in reasons: print('::error::' + r)
              sys.exit(1)
          def main():
              pr = get(f'/repos/{REPO}/pulls/{N}'); sha = pr['head']['sha']
              if LABEL in [l['name'] for l in pr.get('labels', [])]: print('R-approved already present'); return 0
              files = paged(f'/repos/{REPO}/pulls/{N}/files')
              adds = {f['filename']: '\n'.join(l[1:] for l in (f.get('patch') or '').splitlines() if l.startswith('+') and not l.startswith('+++')) for f in files if f.get('status') != 'removed'}
              why = [f"paths: {', '.join(f['filename'] for f in files if PAY_PATH.search(f['filename']))[:200]}"] if any(PAY_PATH.search(f['filename']) for f in files) else []
              for p, t in adds.items():
                  if not KW_SKIP.search(p) and PAY_KW.search(t): why.append(f'keyword `{PAY_KW.search(t).group(0).lower()}` in {p}'); break
              if not why: print('not payment-related, nothing to do'); return 0
              # 2 secrets
              texts = dict(adds); sec = []
              for f in files:
                  if f.get('status') != 'removed' and f.get('patch') is None and f['filename'] not in texts:
                      d = get(f"/repos/{REPO}/contents/{f['filename']}?ref={sha}")
                      if isinstance(d, dict) and d.get('encoding') == 'base64' and d.get('size', 0) < 1_000_000:
                          texts[f['filename']] = base64.b64decode(d['content']).decode('utf8', 'replace')
              for p, t in texts.items():
                  if LIVE_KEY.search(t): sec.append(f'secret pattern in {p}')
              gl = os.environ.get('GITLEAKS')
              if gl and os.path.exists(gl):
                  d = tempfile.mkdtemp(prefix='ag-')
                  try:
                      for p, t in texts.items():
                          fp = os.path.join(d, p.lstrip('/')); os.makedirs(os.path.dirname(fp), exist_ok=True); open(fp, 'w').write(t + '\n')
                      rep = d + '.json'
                      r = subprocess.run([gl, 'detect', '--no-git', '--no-banner', '--redact', '--source', d, '-f', 'json', '-r', rep, '--exit-code', '3'], capture_output=True, text=True, timeout=120)
                      if r.returncode == 3:
                          for x in json.load(open(rep)): sec.append(f"gitleaks {x.get('RuleID')} in {x.get('File','').replace(d + '/', '')}")
                      elif r.returncode != 0: sec.append(f'gitleaks failed to run (rc={r.returncode}), not treated as clean')
                  finally: shutil.rmtree(d, ignore_errors=True)
              else: print('note: gitleaks binary unavailable, regex scan only')
              sec = sorted(set(sec))
              # 1 CI (wait for running checks)
              deadline = time.time() + int(os.environ.get('WAIT', '420'))
              while True:
                  fail, pend, ok = [], [], []
                  for r in paged(f'/repos/{REPO}/commits/{sha}/check-runs', 'check_runs'):
                      n = r.get('name', '')
                      if n == 'gates' or n.startswith('gates /') or n.startswith('agent-gates'): continue
                      if r.get('status') != 'completed': pend.append(n)
                      elif r.get('conclusion') in OK_C: ok.append(n)
                      else: fail.append(f"{n} ({r.get('conclusion')})")
                  for s in (get(f'/repos/{REPO}/commits/{sha}/status') or {}).get('statuses', []):
                      c = s.get('context', '')
                      if c == 'gates' or c.startswith('agent-gates'): continue
                      st = s['state']
                      if st == 'success': ok.append(c)
                      elif st == 'pending': pend.append(c)
                      else: fail.append(f'{c} ({st})')
                  if fail or not pend or time.time() > deadline: break
                  print(f'waiting for CI: {", ".join(pend)}'); time.sleep(20)
              reasons = []
              if fail: reasons.append('CI check(s) failed: ' + ', '.join(fail))
              if pend and not fail: reasons.append('CI still running after waiting: ' + ', '.join(pend) + ' (re-run this job when it finishes)')
              if sec: reasons.append('possible secret in the diff: ' + '; '.join(sec) + ' (value not shown). Remove it, rotate the key if real, push again.')
              # 3 smoke
              tree = get(f'/repos/{REPO}/git/trees/{sha}?recursive=1') or {}
              smoke = [t['path'] for t in tree.get('tree', []) if t.get('type') == 'blob' and SMOKE_PATH.search(t['path']) and 'node_modules' not in t['path']]
              d = get(f'/repos/{REPO}/contents/package.json?ref={sha}')
              if isinstance(d, dict) and d.get('encoding') == 'base64':
                  try: smoke += [f'package.json script `{k}`' for k in (json.loads(base64.b64decode(d['content'])).get('scripts') or {}) if SMOKE_SCRIPT.search(k)]
                  except Exception: pass
              notes = []
              if smoke:
                  if any(SMOKE_CHECK.search(x) for x in ok): notes.append('Stripe test-mode smoke check green')
                  elif not any(SMOKE_CHECK.search(x) for x in pend):
                      reasons.append('repo has a Stripe test-mode smoke path (' + ', '.join(smoke[:3]) + ') but no green check named like stripe/smoke on this commit. Run it in TEST mode (never live keys), then report it: `gh api repos/' + REPO + '/statuses/' + sha + ' -f state=success -f context=stripe-smoke -f description="stripe test-mode smoke passed"` (or make it a CI job), then re-run this job.')
              else: notes.append('no Stripe smoke path in this repo')
              if not ok and not fail and not pend: notes.append('no CI checks exist on this commit (CI criterion vacuous)')
              if reasons: finish_block(f'{sha[:7]}:{hashlib.sha1("|".join(reasons).encode()).hexdigest()[:8]}', why, reasons)
              d, _ = req('POST', f'/repos/{REPO}/labels', {'name': LABEL, 'color': '0E8A16', 'description': 'Payment change approved: auto by the gate (CI + no secrets + smoke) or by R in chat'})
              d, _ = req('POST', f'/repos/{REPO}/issues/{N}/labels', {'labels': [LABEL]})
              if isinstance(d, dict) and '_err' in d:
                  print(f"::error::could not add the label ({d['_err']}): the caller workflow needs permissions pull-requests: write (or this PR is from Dependabot). An agent can add it by hand after the checks above passed: gh pr edit {N} -R {REPO} --add-label {LABEL}")
                  sys.exit(1)
              comment(f'**auto-R-approved by gate** (commit {sha[:7]}, {now()})\n\nPayment-related change ({"; ".join(why)}). Passed: CI {("checks green (" + str(len(ok)) + ")") if ok else "none present on this commit"}, no secrets in the diff (gitleaks + live-key regex), Stripe smoke: {"green" if smoke else "n/a (no smoke path)"}.\n'
                      + ''.join(f'- {x}\n' for x in notes) + '\nThe gate never merges and never touches keys, prices or live config. Listed in the daily digest.')
              print(f'auto-R-approved by gate: {REPO}#{N} {sha[:7]}'); return 0
          if __name__ == '__main__': sys.exit(main())
          PYGATE
  push-trailers:
    # Warn-only: pushes to main should carry Agent: and Task: lines in every commit.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Agent + Task lines on pushed commits (warn-only)
        env: {BEFORE: "${{ github.event.before }}", AFTER: "${{ github.sha }}"}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$AFTER -1"; else range="$BEFORE..$AFTER"; fi
          miss=0
          for c in $(git rev-list --no-merges $range); do
            msg=$(git log -1 --format=%B $c)
            if ! echo "$msg" | grep -qiE '^\s*Agent:\s*\S+' || ! echo "$msg" | grep -qiE '^\s*Task:\s*\S+'; then
              echo "::warning::Commit ${c:0:7} by $(git log -1 --format=%an $c) lacks Agent:/Task: lines"; miss=$((miss+1)); fi
          done
          echo "Commits missing lines: $miss (warn-only, not failing)"
