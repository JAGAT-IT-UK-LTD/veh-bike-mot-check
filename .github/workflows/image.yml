# Builds the static /guides image (Dockerfile.guides) on GitHub's runner and pushes it to GHCR as
# ghcr.io/jagat-it-uk-ltd/veh-bike-mot-check-guides:<sha7>, :<full sha> and :latest. Nothing is built on the VPS
# (the 19 Oct 2026 OOM outage came from docker builds on the production box) and no image is shipped over ssh:
# the owner's rule since 29 Oct 2026 is GitHub builds, the box pulls. Recipe: ~/ruhul-app-devo/DEPLOY-OFFBOX.md
# and the ship-web skill on the owner's Mac.
#
# Deploy on uk-vps after a green run (one service, under the shared lock, the proxy is never touched):
#   cd /docker/motguides && printf 'IMAGE_TAG=<sha7>\n' > .env
#   flock -w 600 /run/build.lock docker compose pull guides
#   flock -w 600 /run/build.lock docker compose up -d --no-build --no-deps guides
# The box needs read access to the package (public package, or a read:packages login on the box).
#
# The main checker (server.js) has no image here yet; it still runs from its own compose in /docker/bikemotcheck.
name: image
on:
  push:
    branches: [main]
    paths:
      - guides.js
      - guides-data.json
      - Dockerfile.guides
      - nginx.guides.conf
      - .github/workflows/image.yml
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/jagat-it-uk-ltd/veh-bike-mot-check-guides
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: build Dockerfile.guides (linux/amd64) and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.guides
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: what was built
        run: |
          echo "${{ steps.meta.outputs.tags }}"
          echo "deploy on the box: IMAGE_TAG=${GITHUB_SHA::7}"
