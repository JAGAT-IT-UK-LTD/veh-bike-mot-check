# Builds the static /guides image (Dockerfile.guides) on GitHub's runner, pushes it to GHCR, ships it to the UK VPS over
# ssh and recreates the container there. Nothing is built on the VPS any more (the 19 Oct 2026 OOM outage came from
# docker builds on the production box). Recipe: ~/ruhul-app-devo/DEPLOY-OFFBOX.md on the owner's Mac.
#
# Per repo settings are the env block below. The ssh step needs three repo secrets (set with deploy.sh --secrets <repo>):
# DEPLOY_SSH_KEY (private key whose public half sits in /root/.ssh/authorized_keys on the box as a forced command that can
# only run /root/ops/deploy-receive.sh), DEPLOY_KNOWN_HOSTS (ssh-keyscan of the box), DEPLOY_HOST (root@<box ip>).
# Without them the run still builds and pushes to GHCR and then stops. The GHCR push may fail on storage quota; the ssh
# ship is the delivery path, so that step does not stop the run.
#
# This repo's image is the /guides container only (motguides on the box, service guides). The main checker (server.js)
# has no image here yet. The receiver recreates /root/<PROJECT>/<COMPOSE_FILE>, so the project folder on the box must be
# /root/motguides with docker-compose.vps.yml from this repo (image: ...-guides:${IMAGE_TAG}).
name: image
on:
  push:
    branches: [main]
    paths:
      - guides.js
      - guides-data.json
      - Dockerfile.guides
      - nginx.guides.conf
      - docker-compose.vps.yml
      - .github/workflows/image.yml
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
env:
  PROJECT: motguides
  COMPOSE_FILE: docker-compose.vps.yml
  SERVICES: guides
  HEALTHZ: https://bikemotcheckuk.cloud/guides/healthz
  IMAGE: ghcr.io/jagat-it-uk-ltd/veh-bike-mot-check-guides
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: build (linux/amd64, BUILD_COMMIT and revision label)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.guides
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: push to GHCR (private package; a quota failure does not stop the deploy)
        continue-on-error: true
        run: |
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | xargs -rn1 docker push
      - name: ship to the box over ssh and recreate the container
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then echo "no deploy secrets on this repo, image built and pushed only"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          IMG="$IMAGE:${GITHUB_SHA::7}"
          docker image inspect "$IMG" >/dev/null
          SSH="ssh -i $HOME/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes $DEPLOY_HOST"
          first=1
          for svc in $SERVICES; do
            if [ "$first" = 1 ]; then
              docker save "$IMG" | gzip -1 | $SSH deploy "$PROJECT" "$IMG" "$COMPOSE_FILE" "$svc" "$HEALTHZ" "$GITHUB_SHA"
            else
              $SSH redeploy "$PROJECT" "$IMG" "$COMPOSE_FILE" "$svc" "-" "$GITHUB_SHA"
            fi
            first=0
          done
      - name: what was built
        run: echo "${{ steps.meta.outputs.tags }}"
