# Static /guides for bikemotcheckuk.cloud, served by nginx:alpine instead of
# the node:20-alpine container that ran guides.js. Traefik sends only the
# /guides prefix here. Behaviour copied from guides.js: www goes to the apex,
# a trailing slash is a 301 to the clean URL, an unknown slug is a real 404
# with noindex, anything outside /guides bounces to /guides.

server {
    listen 80;
    server_name ~^www\.(?<apex>.+)$;
    return 301 https://$apex$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Relative Location headers (/guides), like guides.js sent. An absolute
    # http:// one behind Traefik would cost a second hop back to https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/plain application/xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Cache-Control "public, max-age=600";

    # /guides/slug/ becomes /guides/slug, same as the Node server did.
    rewrite ^/(.+)/$ /$1 permanent;

    location = /guides/healthz {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Unknown slug: the same "Guide not found" page guides.js sent, not cached.
    error_page 404 /guides/404.html;
    location = /guides/404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The files are guides.html and guides/<slug>.html; the public URLs have
    # no .html, and a direct .html request is a 404 so there is one URL per page.
    location ~ \.html$ {
        return 404;
    }

    location /guides {
        try_files $uri.html $uri =404;
    }

    location / {
        return 302 /guides;
    }
}
